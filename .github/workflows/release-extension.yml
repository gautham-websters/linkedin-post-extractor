name: Package and Release Chrome Extension

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package extension
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read extension version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(jq -r '.version' manifest.json)"
          if [[ -z "$VERSION" || "$VERSION" == "null" ]]; then
            echo "Could not read version from manifest.json"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extension version: $VERSION"

      - name: Validate release tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="${{ steps.version.outputs.version }}"

          if [[ "$TAG_VERSION" != "$MANIFEST_VERSION" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match manifest.json version $MANIFEST_VERSION"
            exit 1
          fi

      - name: Validate required extension files
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_FILES=(
            manifest.json
            background.js
            content.js
            minixlsx.js
            offscreen.html
            offscreen.js
            page_bridge.js
            popup.css
            popup.html
            popup.js
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Missing required extension file: $file"
              exit 1
            fi
          done

          echo "All required extension files are present."

      - name: Build clean extension ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          PACKAGE_NAME="LinkedIn-Post-Extractor-v${VERSION}.zip"
          STAGING_DIR="dist/extension"

          rm -rf dist
          mkdir -p "$STAGING_DIR"

          REQUIRED_FILES=(
            manifest.json
            background.js
            content.js
            minixlsx.js
            offscreen.html
            offscreen.js
            page_bridge.js
            popup.css
            popup.html
            popup.js
          )

          cp "${REQUIRED_FILES[@]}" "$STAGING_DIR/"

          cd "$STAGING_DIR"
          zip -r -9 "../$PACKAGE_NAME" .
          cd ../..

          echo "package=dist/$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"

          echo "Created: dist/$PACKAGE_NAME"
          unzip -l "dist/$PACKAGE_NAME"

      - name: Upload packaged extension as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinkedIn-Post-Extractor-v${{ steps.version.outputs.version }}
          path: ${{ steps.package.outputs.package }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          PACKAGE_PATH: ${{ steps.package.outputs.package }}
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail

          cat > release-body.md <<EOF
          ### Install
          1. Download **$PACKAGE_NAME** from **Assets** below. Do not use GitHub's **Source code** ZIP.
          2. Extract the ZIP.
          3. Open \`chrome://extensions\`, enable **Developer mode**, click **Load unpacked**, and select the extracted folder.
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$PACKAGE_PATH" --clobber
            gh release edit "$RELEASE_TAG" \
              --title "LinkedIn Post Extractor $RELEASE_TAG" \
              --notes-file release-body.md
          else
            gh release create "$RELEASE_TAG" "$PACKAGE_PATH" \
              --title "LinkedIn Post Extractor $RELEASE_TAG" \
              --notes-file release-body.md
          fi

          echo "Released $PACKAGE_NAME on $RELEASE_TAG"