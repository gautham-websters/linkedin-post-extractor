name: Package and Release Chrome Extension

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Package extension
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read extension version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(jq -r '.version' manifest.json)"
          if [[ -z "$VERSION" || "$VERSION" == "null" ]]; then
            echo "Could not read version from manifest.json"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extension version: $VERSION"

      - name: Validate release tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="${{ steps.version.outputs.version }}"

          if [[ "$TAG_VERSION" != "$MANIFEST_VERSION" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match manifest.json version $MANIFEST_VERSION"
            echo "Update manifest.json to $TAG_VERSION or push the matching tag."
            exit 1
          fi

      - name: Validate manifest file references
        shell: python
        run: |
          import json
          from pathlib import Path

          manifest = json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          files = {"manifest.json"}

          def add(value):
              if isinstance(value, str) and value:
                  files.add(value)
              elif isinstance(value, dict):
                  for item in value.values():
                      add(item)
              elif isinstance(value, list):
                  for item in value:
                      add(item)

          action = manifest.get("action", {})
          add(action.get("default_popup"))
          add(action.get("default_icon"))

          background = manifest.get("background", {})
          add(background.get("service_worker"))
          add(background.get("scripts"))

          for script in manifest.get("content_scripts", []):
              add(script.get("js"))
              add(script.get("css"))

          add(manifest.get("icons"))
          add(manifest.get("options_page"))
          add(manifest.get("options_ui", {}).get("page"))
          add(manifest.get("side_panel", {}).get("default_path"))
          add(manifest.get("devtools_page"))

          missing = [name for name in sorted(files) if not Path(name).is_file()]
          if missing:
              print("The manifest references files that are missing:")
              for name in missing:
                  print(f"  - {name}")
              raise SystemExit(1)

          print("Manifest references are valid.")

      - name: Build extension ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          PACKAGE_NAME="LinkedIn-Search-Post-Extractor-v${VERSION}.zip"
          STAGING_DIR="dist/extension"

          rm -rf dist
          mkdir -p "$STAGING_DIR"

          rsync -a ./ "$STAGING_DIR/" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='dist/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='test/' \
            --exclude='docs/' \
            --exclude='*.zip' \
            --exclude='*.log' \
            --exclude='.DS_Store' \
            --exclude='README*'

          cd "$STAGING_DIR"
          zip -r -9 "../$PACKAGE_NAME" .
          cd ../..

          echo "package=dist/$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"

          echo "Created: dist/$PACKAGE_NAME"
          unzip -l "dist/$PACKAGE_NAME"

      - name: Upload packaged extension as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinkedIn-Search-Post-Extractor-v${{ steps.version.outputs.version }}
          path: ${{ steps.package.outputs.package }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          PACKAGE_PATH: ${{ steps.package.outputs.package }}
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; replacing packaged ZIP."
            gh release upload "$RELEASE_TAG" "$PACKAGE_PATH" --clobber
          else
            gh release create "$RELEASE_TAG" "$PACKAGE_PATH" \
              --title "LinkedIn Search Post Extractor $RELEASE_TAG" \
              --generate-notes
          fi

          echo "Released $PACKAGE_NAME on $RELEASE_TAG"
